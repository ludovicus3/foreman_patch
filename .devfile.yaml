schemaVersion: 2.2.0
metadata:
  name: foreman-patch
  namespace: workspace-jason
projects:
  - clonePath: foreman_patch
    git:
      remotes:
        origin: git@github.com:ludovicus3/foreman_patch.git
    name: foreman-patch
  - clonePath: foreman
    git:
      checkoutFrom:
        revision: '{{foremanVersion}}'
      remotes:
        origin: https://github.com/theforeman/foreman.git
    name: foreman
components:
  - container:
      endpoints:
        - exposure: none
          name: postgresql
          targetPort: 5432
      env:
        - name: POSTGRES_USER
          value: '{{postgresUser}}'
        - name: POSTGRES_PASSWORD
          value: '{{postgresPassword}}'
        - name: POSTGRES_DB
          value: '{{postgresDb}}'
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      image: postgres:13
      volumeMounts:
        - name: data
          path: /var/lib/postgresql/data
  - container:
      endpoints:
        - exposure: public
          name: rails
          protocol: http
          targetPort: 5000
          urlRewriteSupported: true
        - exposure: public
          name: webpack
          protocol: http
          targetPort: 3808
          urlRewriteSupported: true
      env:
        - name: RAILS_ENV
          value: development
        - name: FOREMAN_FQDN
          value: foreman.example.com
        - name: FOREMAN_DOMAIN
          value: example.com
        - name: DATABASE_URL
          value: postgresql://{{postgresUser}}:{{postgresPassword}}@localhost/{{postgresDb}}?pool=5
      image: quay.io/ludovicus/foreman-developer-image:bookworm
      memoryLimit: 2G
      mountSources: true
      sourceMapping: /projects
    name: tools
variables:
  foremanVersion: 3.1-stable
  postgresDb: foreman
  postgresUser: foreman
  postgresPassword: REDACTED
